<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The QTBDL</title>
  <link href="https://rsms.me/inter/inter.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
 
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: #1f1f1f;
      color: #e5e5e5;
    }
    .list-entry {
      transition: all 0.25s ease;
    }
    .list-entry:hover {
      background-color: #2a2a2a;
      transform: translateX(12px);
      border-color: #ff6b35;
    }
    .rank {
      font-size: 2.75rem;
      font-weight: 900;
      line-height: 1;
      color: #ff4d2e;
    }
    .accent {
      color: #ff6b35;
    }
  </style>
</head>
<body class="min-h-screen pb-20">
  <div class="max-w-4xl mx-auto px-6 py-12">

    <!-- Header -->
    <div class="text-center mb-16">
      <h1 class="text-6xl font-black tracking-tighter text-white">THE QTBDL</h1>
      <p class="text-orange-400 text-2xl mt-2">The Quantam Baocessing Demon List</p>
      <p class="text-zinc-500 mt-4">Main List • Demons</p>
    </div>

    <!-- Search -->
    <div class="mb-10">
      <input
        type="text"
        id="searchInput"
        placeholder="Search levels, creators, or verifiers..."
        class="w-full bg-zinc-900 border border-zinc-700 focus:border-orange-500 rounded-2xl px-6 py-5 text-lg outline-none transition-colors">
    </div>

    <!-- Demon List -->
    <div id="demonList" class="space-y-3">
      <!-- Populated by JavaScript -->
    </div>
  </div>

  <script>
    const demons = [
      {
        rank: 1,
        name: "B",
        publisher: "motleyorc",
        verifier: "Urictic",
        id: "34085027",
        points: "5.80"
      },
      {
        rank: 2,
        name: "Deadlocked",
        publisher: "RobTop",
        verifier: "Urictic",
        id: "3",
        points: "4.68"
      },
      {
        rank: 3,
        name: "Clubstep",
        publisher: "Robtop",
        verifier: "Arick",
        id: "1",
        points: "2.83"
      },
      {
        rank: 4,
        name: "robtop",
        publisher: "chupda",
        verifier: "Ben",
        id: "125283",
        points: "2.81"
      },
      {
        rank: 5,
        name: "Depressure",
        publisher: "Serponge",
        verifier: "Urictic",
        id: "45622672",
        points: "2.19"
      },
      {
        rank: 6,
        name: "iSpyWithMyLittleEye",
        publisher: "Voxicat",
        verifier: "Arick",
        id: "89886591",
        points: "1.87",
      },
    ];

    function renderDemons(filteredDemons) {
      const container = document.getElementById('demonList');
      container.innerHTML = '';

      filteredDemons.forEach(demon => {
        const div = document.createElement('div');
        div.className = `list-entry group flex items-center gap-8 bg-zinc-900 border border-zinc-800 hover:border-[#ff6b35] rounded-3xl px-8 py-7`;
        div.innerHTML = `
          <div class="rank w-24 text-right">${demon.rank}</div>
         
          <div class="flex-1 min-w-0">
            <div class="text-2xl font-semibold text-white group-hover:text-orange-400 transition-colors truncate">
              ${demon.name}
            </div>
            <div class="text-zinc-400 mt-1">
              by <span class="text-white">${demon.publisher}</span> • Verified by <span class="text-white">${demon.verifier}</span>
            </div>
          </div>

          <div class="text-right">
            <div class="text-emerald-400 font-medium text-xl">${demon.points}</div>
            <div class="text-xs text-zinc-500">points</div>
          </div>

          <a href="https://gdladder.com/level/${demon.id}" target="_blank"
             class="ml-4 text-orange-400 hover:text-orange-300">
            <i class="fas fa-external-link-alt"></i>
          </a>
        `;
        container.appendChild(div);
      });
    }

    // Search functionality
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
     
      const filtered = demons.filter(d =>
        d.name.toLowerCase().includes(term) ||
        d.publisher.toLowerCase().includes(term) ||
        d.verifier.toLowerCase().includes(term)
      );
     
      renderDemons(filtered.length ? filtered : demons);
    });

    // Initial render
    renderDemons(demons);
  </script>
</body>
</html>
